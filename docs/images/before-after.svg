<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <path id="cursor" d="M0 0V26L6.5 20L11 29.5L15.5 27.5L11 18.5H19Z" fill="#1d1d1f" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <g id="screens">
      <rect x="0" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#c9d6d6" stroke-width="2"/>
      <rect x="10" y="22" width="120" height="76" rx="6" fill="#eef5f5" stroke="#9fc6c5" stroke-width="1.5"/>
      <rect x="10" y="10" width="120" height="12" rx="4" fill="#9fc6c5"/>
      <rect x="64" y="118" width="52" height="10" fill="#c9d6d6"/>
      <rect x="44" y="128" width="92" height="7" rx="3.5" fill="#c9d6d6"/>
      <rect x="220" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#c9d6d6" stroke-width="2"/>
      <rect x="236" y="16" width="148" height="86" rx="6" fill="#f4f4f6" stroke="#d6d6dc" stroke-width="1.5"/>
      <rect x="236" y="16" width="148" height="13" rx="4" fill="#d6d6dc"/>
      <rect x="318" y="72" width="50" height="18" rx="5" fill="#6AB0AF"/>
      <rect x="284" y="118" width="52" height="10" fill="#c9d6d6"/>
      <rect x="264" y="128" width="92" height="7" rx="3.5" fill="#c9d6d6"/>
    </g>
  </defs>
  <rect width="960" height="430" rx="22" fill="#f7fafa"/>

  <!-- Without -->
  <text x="250" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1f">Without Hopclick</text>
  <text x="250" y="80" text-anchor="middle" font-size="15" fill="#5b6b6b">Two clicks: the first one only moves focus</text>
  <g transform="translate(50 116)">
    <use href="#screens"/>
    <use href="#cursor" transform="translate(338 78)"/>
  </g>
  <g transform="translate(50 284)" font-size="15">
    <circle cx="14" cy="14" r="14" fill="#e5e5ea"/><text x="14" y="19" text-anchor="middle" font-weight="700" fill="#1d1d1f">1</text>
    <text x="38" y="19" fill="#1d1d1f">Click the button</text>
    <text x="38" y="40" fill="#c0392b" font-weight="600" font-size="14">window focused, click lost</text>
    <circle cx="14" cy="72" r="14" fill="#e5e5ea"/><text x="14" y="77" text-anchor="middle" font-weight="700" fill="#1d1d1f">2</text>
    <text x="38" y="77" fill="#1d1d1f">Click the button again</text>
    <text x="38" y="98" fill="#5b6b6b" font-size="14">now the action happens</text>
  </g>

  <line x1="480" y1="40" x2="480" y2="390" stroke="#dbe6e6" stroke-width="2"/>

  <!-- With -->
  <text x="710" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#2f7372">With Hopclick</text>
  <text x="710" y="80" text-anchor="middle" font-size="15" fill="#5b6b6b">One click does both</text>
  <g transform="translate(510 116)">
    <use href="#screens"/>
    <path d="M70 -4Q170 -60 300 46" stroke="#6AB0AF" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 13" fill="none"/>
    <use href="#cursor" transform="translate(338 78)"/>
    <circle cx="338" cy="78" r="15" fill="none" stroke="#6AB0AF" stroke-width="3" opacity="0.8"/>
  </g>
  <g transform="translate(510 284)" font-size="15">
    <circle cx="14" cy="14" r="14" fill="#6AB0AF"/><text x="14" y="19" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
    <text x="38" y="19" fill="#1d1d1f">Click the button</text>
    <text x="38" y="40" fill="#2f7372" font-weight="600" font-size="14">window focused and button pressed</text>
    <text x="38" y="77" fill="#5b6b6b" font-size="14">Typical extra delay: 13–40 ms</text>
  </g>
</svg>
