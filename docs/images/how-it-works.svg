<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7d9d9c"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="22" fill="#f7fafa"/>
  <g font-size="14" text-anchor="middle">
    <!-- 1 -->
    <rect x="28" y="70" width="160" height="96" rx="14" fill="#ffffff" stroke="#c9d6d6" stroke-width="2"/>
    <text x="108" y="104" font-weight="700" fill="#1d1d1f">Mouse down</text>
    <text x="108" y="126" fill="#5b6b6b">held by the</text>
    <text x="108" y="144" fill="#5b6b6b">event tap</text>
    <!-- 2 -->
    <rect x="216" y="70" width="168" height="96" rx="14" fill="#ffffff" stroke="#c9d6d6" stroke-width="2"/>
    <text x="300" y="104" font-weight="700" fill="#1d1d1f">Another display?</text>
    <text x="300" y="126" fill="#5b6b6b">inactive window,</text>
    <text x="300" y="144" fill="#5b6b6b">not menu / Dock</text>
    <!-- 3 -->
    <rect x="412" y="70" width="168" height="96" rx="14" fill="#ffffff" stroke="#6AB0AF" stroke-width="2.5"/>
    <text x="496" y="104" font-weight="700" fill="#1d1d1f">Bring forward</text>
    <text x="496" y="126" fill="#5b6b6b">raise + make it the</text>
    <text x="496" y="144" fill="#5b6b6b">main, focused window</text>
    <!-- 4 -->
    <rect x="608" y="70" width="152" height="96" rx="14" fill="#ffffff" stroke="#6AB0AF" stroke-width="2.5"/>
    <text x="684" y="104" font-weight="700" fill="#1d1d1f">Wait until ready</text>
    <text x="684" y="126" fill="#5b6b6b">window really</text>
    <text x="684" y="144" fill="#5b6b6b">focused · ≤ 200 ms</text>
    <!-- 5 -->
    <rect x="788" y="70" width="144" height="96" rx="14" fill="#6AB0AF"/>
    <text x="860" y="104" font-weight="700" fill="#ffffff">Release</text>
    <text x="860" y="126" fill="#ffffff">your original</text>
    <text x="860" y="144" fill="#ffffff">click, unchanged</text>
  </g>
  <g stroke="#7d9d9c" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="190" y1="118" x2="212" y2="118"/>
    <line x1="386" y1="118" x2="408" y2="118"/>
    <line x1="582" y1="118" x2="604" y2="118"/>
    <line x1="762" y1="118" x2="784" y2="118"/>
  </g>
  <!-- "no" branch -->
  <path d="M300 168V222H860V170" fill="none" stroke="#b9c9c9" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="580" y="214" text-anchor="middle" font-size="13" fill="#7d9d9c">no → the click passes straight through, macOS behaves as usual</text>
  <text x="480" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">No synthetic clicks: the same click you made, delivered once the window is ready</text>
  <text x="480" y="270" text-anchor="middle" font-size="13" fill="#5b6b6b">Windows the activated app pushed up on your other displays are put back on top afterwards.</text>
</svg>
